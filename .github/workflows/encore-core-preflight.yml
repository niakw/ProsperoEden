name: Encore core source regressions — no GUI or PS5 build

on:
  push:
    branches: [dev/ps5-sparse-jit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encore-core-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[core-ready]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source (GitHub only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host-only JSON, Boost.Container and clang sanitizer fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev libboost-container-dev clang-18

      - name: Audit generic graphics, JIT, runtime and offline game networking
        run: |
          set -euxo pipefail
          python3 -B tools/check-python-source-syntax.py
          python3 -B tools/check-ps5-log-analysis.py
          python3 -B tools/check-ps5-frame-window-analysis.py
          python3 -B tools/check-ps5-quiet-frame-pressure.py
          python3 -B tools/check-performance-policy.py
          python3 -B tools/check-ps5-direct-pool-host.py
          python3 -B tools/check-vulkan-shader-workers.py
          python3 -B tools/check-vulkan-shader-workers-cpp-host.py
          python3 -B tools/check-worker-topology.py
          python3 -B tools/check-worker-affinity.py
          python3 -B tools/check-runtime-frame-budget.py
          python3 -B tools/check-universal-emulation-policy.py
          python3 -B tools/check-guest-network-isolation.py
          python3 -B tools/check-fc27-hle-compat.py
          python3 -B tools/check-game-liveness.py
          python3 -B tools/check-fc27-trace.py
          python3 -B tools/check-experimental-performance.py
          python3 -B tools/check-ps5-architecture.py
          python3 -B tools/sync-glyph-overrides.py --manifest data/glyph-overrides.json --check
          python3 -B tools/check-glyph-overrides-runtime.py
          python3 -B tools/check-addon-snapshot-host.py
          python3 -B tools/check-ps-glyph-packs.py
          python3 -B tools/check-controller-semantic-mapping.py
          python3 -B tools/check-ps5-autocontrol-context.py
          python3 -B tools/check-gpu-native-diagnostics.py
          python3 -B tools/check-gpu-memory-mapping-source.py
          python3 -B tools/check-gpu-backport-replay-host.py
          python3 -B tools/check-eden-atomic-cache-refresh-host.py
          python3 -B tools/check-ps5-guest-null-backing-host.py
          python3 -B tools/check-guest-backport-replay-host.py
          python3 -B tools/check-gpu-physical-copy-bounds-host.py
          python3 -B tools/check-gpu-physical-copy-cpp-host.py
          python3 -B tools/check-gpu-atomic-forward-cpp-host.py
          python3 -B tools/check-gpu-asid-lifetime-cpp-host.py
          python3 -B tools/check-jit-memory-policy.py
          python3 -B tools/check-jit-startup-retry.py
          python3 -B tools/check-vulkan-pipeline-persistence.py
          python3 -B tools/check-vulkan-cache-atomic.py
          python3 -B tools/check-jit-dense-alias-host.py
          python3 -B tools/check-jit-sparse-host.py
          python3 -B tools/check-sparse-index-boundary.py
          python3 -B tools/check-sparse-slot-reuse-host.py
          python3 -B tools/check-shader-cache-pressure.py
          python3 -B tools/check-vulkan-gc-budget-host.py
          python3 -B tools/check-vulkan-gc-prefetch-host.py
          python3 -B tools/check-vulkan-gc-mixed-prefetch-host.py
          python3 -B tools/check-vulkan-readback-small-vector-host.py
          python3 -B tools/check-vulkan-readback-batch-integration-host.py
          python3 -B tools/check-vulkan-pipeline-trace-thread-host.py
          python3 -B tools/check-vulkan-present-wait-host.py
          python3 -B tools/check-vulkan-present-source-replay-host.py
          python3 -B tools/check-log-budget.py
          python3 -B tools/check-bounded-logs.py
          python3 -B tools/check-nlib-media-safety.py
          python3 -B tools/check-ci-cache.py

      - name: Exercise Sony mspace ownership via host UBSan/TSan (no PS5 SDK)
        run: |
          set -euxo pipefail
          python3 -B tools/check-heap-growth.py
          python3 -B tools/check-heap-growth-rollback-host.py
          python3 -B tools/check-heap-growth-diagnostics-host.py
          python3 -B tools/check-crash-provenance-host.py

      - name: Check approved user-facing UX invariants (no graphics compilation)
        run: |
          set -euxo pipefail
          python3 -B tools/check-native-ui-focus.py
          python3 -B tools/check-home-reference.py
          python3 -B tools/check-home-media.py
          python3 -B tools/check-encore-ux.py
          python3 -B tools/check-ps5-ui-controls-per-game.py

      - name: Validate all feature-branch source diffs
        run: |
          git fetch --no-tags --depth=1 origin fix/0.40-zbic-13.60
          git diff --check FETCH_HEAD HEAD
          echo CORE_PREFLIGHT_ALL_PASS
